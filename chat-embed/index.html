<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simha Studio – הזמנות דיגיטליות</title>
  <!-- default n8n chat widget styles -->
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <!-- our overrides, must load after the n8n stylesheet -->
  <link rel="stylesheet" href="style.css">
  <script type="module" defer src="app.js"></script>
</head>
<body>
  <main class="page">
    <h1>Simha Studio</h1>
    <p class="tagline">ההזמנה הדיגיטלית שהופכת את היום שלכם לבלתי נשכח</p>
    <p>חתונות, בר מצווה ואירוסין – הזמנות דיגיטליות עם RSVP, מוזיקה ומפה אינטראקטיבית.</p>
    <p>יש לכם שאלה על החבילות, המחירים או התהליך? לחצו על כפתור הצ'אט בפינה והעוזרת הווירטואלית שלנו תענה.</p>
  </main>
  <!-- chat widget mounts here -->
  <div id="n8n-chat"></div>
</body>
</html>
